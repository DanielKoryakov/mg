<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Game KD</title>
  <link rel="apple-touch-icon" href="https://danielkoryakov.github.io/mg/apple-touch-icon.png" sizes="180x180">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      background: #0A0A0F;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: auto;
    }

    /* Кнопка переключения цвета */
    #color-toggle-btn {
      position: fixed;
      bottom: 20px;
      left: 20px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(30, 30, 40, 0.6);
      border: 2px solid rgba(100, 255, 255, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      pointer-events: auto;
      z-index: 100;
      transition: all 0.25s ease;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.5);
    }

    #color-toggle-btn:hover,
    #color-toggle-btn:active {
      transform: scale(1.12);
      border-color: rgba(180, 255, 255, 0.9);
      background: rgba(40, 40, 55, 0.8);
    }

    #color-toggle-btn::after {
      content: '🎨';
      font-size: 20px;
      pointer-events: none;
    }

    /* Индикатор режима (скрыт на мобильных по умолчанию, но можно оставить) */
    #mode-indicator {
      position: fixed;
      top: 12px;
      left: 16px;
      color: #777;
      font-size: 13px;
      pointer-events: none;
      opacity: 0.7;
      z-index: 10;
      text-shadow: 0 0 4px #000;
      transition: opacity 0.3s;
    }

    @media (max-width: 768px) {
      #mode-indicator {
        display: none; /* скрываем на мобильных, чтобы не мешать */
      }
      #color-toggle-btn {
        width: 48px;
        height: 48px;
      }
      #color-toggle-btn::after {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <canvas id="particles-canvas"></canvas>
  <div id="mode-indicator">Нажмите C или кнопку 🎨</div>
  <div id="color-toggle-btn"></div>

  <script>
    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');
    const modeIndicator = document.getElementById('mode-indicator');
    const toggleBtn = document.getElementById('color-toggle-btn');

    // Убедимся, что иконка добавлена
    if (!document.querySelector('link[rel="apple-touch-icon"]')) {
      const link = document.createElement('link');
      link.rel = 'apple-touch-icon';
      link.href = 'https://dejected-rat-6853.dataplicity.io/local/apple-touch-icon.png';
      link.sizes = '180x180';
      document.head.appendChild(link);
    }

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // 🎨 Цвета
    const COLORS = [
      { name: 'Голубой',    code: '#00FFFF' },
      { name: 'Фиолетовый', code: '#FF00FF' },
      { name: 'Салатовый',  code: '#BFFF00' }
    ];
    const BG_COLOR = '#0A0A0F';

    // 🔁 Режимы
    const MODES = [
      { id: 'multi', name: 'Все цвета', description: 'меняются при отскоке' },
      { id: 'single-0', name: COLORS[0].name, color: COLORS[0].code },
      { id: 'single-1', name: COLORS[1].name, color: COLORS[1].code },
      { id: 'single-2', name: COLORS[2].name, color: COLORS[2].code }
    ];

    let currentModeIndex = 0;
    function getCurrentMode() {
      return MODES[currentModeIndex];
    }

    function updateModeIndicator() {
      const mode = getCurrentMode();
      if (mode.id === 'multi') {
        modeIndicator.textContent = `🎨 ${mode.name} — ${mode.description}`;
      } else {
        modeIndicator.innerHTML = `🎨 Только <span style="color:${mode.color}; font-weight:600">${mode.name}</span>`;
      }
      // Обновляем цвет рамки кнопки
      toggleBtn.style.borderColor = mode.id === 'multi' 
        ? 'rgba(100, 255, 255, 0.4)' 
        : mode.color + '80'; // 50% прозрачность
    }

    // Переключение режима
    function switchMode() {
      currentModeIndex = (currentModeIndex + 1) % MODES.length;
      updateModeIndicator();
    }

    // Клавиша C
    document.addEventListener('keydown', (e) => {
      if (e.key.toLowerCase() === 'c') {
        e.preventDefault();
        switchMode();
      }
    });

    // Кнопка на экране
    toggleBtn.addEventListener('click', switchMode);
    toggleBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      switchMode();
    });

    // Настройки частиц
    const particleCount = 99;
    const maxDistance = 150;
    const mouseRadius = 150;
    const mouseForce = 0.00175;
    const clickRadius = 150;
    const clickForce = 2.45;

    let particles = [];
    let pointerX = null;
    let pointerY = null;
    let isPointerDown = false;
    let touchStartTime = 0;

    // Указатель
    function updatePointer(x, y) {
      pointerX = x;
      pointerY = y;
    }
    function handlePointerDown() { isPointerDown = true; }
    function handlePointerUp() { isPointerDown = false; }

    // 🖱️ События мыши
    canvas.addEventListener('mousemove', (e) => updatePointer(e.clientX, e.clientY));
    canvas.addEventListener('mousedown', () => handlePointerDown());
    canvas.addEventListener('mouseup', () => handlePointerUp());
    canvas.addEventListener('mouseleave', () => { pointerX = null; pointerY = null; isPointerDown = false; });

    // 👆 Касания
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      updatePointer(touch.clientX, touch.clientY);
      handlePointerDown();
      touchStartTime = Date.now();
    });
    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      updatePointer(touch.clientX, touch.clientY);
    });
    canvas.addEventListener('touchend', (e) => {
      e.preventDefault();
      handlePointerUp();
      const holdDuration = Date.now() - touchStartTime;
      if (holdDuration < 250 && pointerX !== null && pointerY !== null) {
        applyClickForce(pointerX, pointerY);
      }
      pointerX = null;
      pointerY = null;
    });
    canvas.addEventListener('touchcancel', () => {
      handlePointerUp();
      pointerX = null;
      pointerY = null;
    });

    // 💥 Отталкивание
    function applyClickForce(x, y) {
      particles.forEach(p => {
        const dx = p.x - x;
        const dy = p.y - y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < clickRadius) {
          const force = (clickRadius - dist) / clickRadius;
          p.vx += (dx / dist) * clickForce * force;
          p.vy += (dy / dist) * clickForce * force;
        }
      });
    }

    canvas.addEventListener('click', (e) => {
      if (e.pointerType === 'touch') return;
      applyClickForce(e.clientX, e.clientY);
    });

    // 🎨 HEX → RGB
    function hexToRgb(hex) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return [r, g, b];
    }

    // ⚛️ Частица
    class Particle {
      constructor() {
        this.reset();
        this.lastPulse = Date.now();
        this.pulseInterval = 2500 + Math.random() * 2500;
        this.colorIndex = 0;
      }

      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.vx = (Math.random() - 0.5) * 1.0;
        this.vy = (Math.random() - 0.5) * 1.0;
        this.radius = 1.6 + Math.random() * 1.0;
      }

      update() {
        const now = Date.now();
        if (now - this.lastPulse > this.pulseInterval) {
          this.vx += (Math.random() - 0.5) * 0.2;
          this.vy += (Math.random() - 0.5) * 0.2;
          this.lastPulse = now;
          this.pulseInterval = 2500 + Math.random() * 2500;
        }

        this.x += this.vx;
        this.y += this.vy;

        let bounced = false;
        if (this.x <= 0) { this.x = 0; this.vx = Math.abs(this.vx) * 0.8; bounced = true; }
        if (this.x >= canvas.width) { this.x = canvas.width; this.vx = -Math.abs(this.vx) * 0.8; bounced = true; }
        if (this.y <= 0) { this.y = 0; this.vy = Math.abs(this.vy) * 0.8; bounced = true; }
        if (this.y >= canvas.height) { this.y = canvas.height; this.vy = -Math.abs(this.vy) * 0.8; bounced = true; }

        const mode = getCurrentMode();
        if (bounced && mode.id === 'multi') {
          this.colorIndex = (this.colorIndex + 1) % COLORS.length;
        }

        // Взаимодействие с указателем
        if (pointerX !== null && pointerY !== null) {
          const dx = pointerX - this.x;
          const dy = pointerY - this.y;
          const distance = Math.sqrt(dx * dx + dy * dy);
          if (distance < mouseRadius) {
            const force = (mouseRadius - distance) / mouseRadius;
            const strength = mouseForce * force;
            const direction = isPointerDown ? 1 : -1;
            this.vx += dx * strength * direction;
            this.vy += dy * strength * direction;
          }
        }

        // Затухание и ограничение скорости
        this.vx *= 0.9992;
        this.vy *= 0.9992;
        const maxSpeed = 3.0;
        const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
        if (speed > maxSpeed) {
          this.vx = (this.vx / speed) * maxSpeed;
          this.vy = (this.vy / speed) * maxSpeed;
        }
      }

      draw() {
        const mode = getCurrentMode();
        let mainColor = mode.id === 'multi' 
          ? COLORS[this.colorIndex].code 
          : mode.color;

        ctx.shadowColor = mainColor;
        ctx.shadowBlur = 18;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = mainColor;
        ctx.fill();

        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius * 0.6, 0, Math.PI * 2);
        ctx.fillStyle = '#FFFFFF';
        ctx.fill();

        ctx.shadowBlur = 0;
      }

      getCurrentColor() {
        const mode = getCurrentMode();
        return mode.id === 'multi' 
          ? COLORS[this.colorIndex].code 
          : mode.color;
      }
    }

    // 🌟 Создаём 99 частиц
    for (let i = 0; i < particleCount; i++) {
      particles.push(new Particle());
    }

    // 📏 Расстояние
    function dist(p1, p2) {
      const dx = p1.x - p2.x;
      const dy = p1.y - p2.y;
      return Math.sqrt(dx * dx + dy * dy);
    }

    // ▶️ Анимация
    function animate() {
      ctx.fillStyle = BG_COLOR;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      particles.forEach(p => {
        p.update();
        p.draw();
      });

      // Соединения
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const d = dist(particles[i], particles[j]);
          if (d < maxDistance) {
            const opacity = 1 - d / maxDistance;
            const p1 = particles[i];
            const p2 = particles[j];

            const gradient = ctx.createLinearGradient(p1.x, p1.y, p2.x, p2.y);
            const c1 = hexToRgb(p1.getCurrentColor());
            const c2 = hexToRgb(p2.getCurrentColor());

            gradient.addColorStop(0,   `rgba(${c1[0]},${c1[1]},${c1[2]}, ${opacity * 0.8})`);
            gradient.addColorStop(0.5, `rgba(${c2[0]},${c2[1]},${c2[2]}, ${opacity * 0.6})`);
            gradient.addColorStop(1,   `rgba(${c1[0]},${c1[1]},${c1[2]}, ${opacity * 0.8})`);

            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.strokeStyle = gradient;
            ctx.lineWidth = 1.2;
            ctx.stroke();
          }
        }
      }

      requestAnimationFrame(animate);
    }

    // Первичная инициализация индикатора
    updateModeIndicator();

    animate();
  </script>
</body>
</html>
